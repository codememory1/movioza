services:
    _defaults:
        autoconfigure: false
        autowire: true

    # API Error Definitions
    Movioza\MediaProcessing\Application\Exception\ReferencedMediaNotFoundException:
        resource_tags:
            - name: movioza.api_error.definition
              status: 422
              code: referenced_media_not_found
              message: 'Referenced media was not found.'
              log_level: notice

    # Repositories
    movioza.media_processing.media_source_repository.doctrine:
        class: Movioza\MediaProcessing\Infrastructure\Doctrine\Repository\DoctrineMediaSourceRepository

    Movioza\MediaProcessing\Domain\Repository\MediaSourceRepositoryInterface: '@movioza.media_processing.media_source_repository.doctrine'

    # Readers
    movioza.media_processing.media_source_reader.doctrine:
        class: Movioza\MediaProcessing\Infrastructure\Doctrine\Reader\DoctrineMediaSourceReader
        arguments:
            $connection: '@doctrine.dbal.default_connection'

    Movioza\MediaProcessing\Application\Reader\MediaSourceReaderInterface: '@movioza.media_processing.media_source_reader.doctrine'

    # Controllers
    Movioza\MediaProcessing\Presentation\Http\Controller\:
        resource: '%kernel.project_dir%/src/MediaProcessing/Presentation/Http/Controller/**/*Controller.php'
        tags:
            - { name: controller.service_arguments }

    # Console Commands
    Movioza\MediaProcessing\Presentation\Console\Command\:
        resource: '%kernel.project_dir%/src/MediaProcessing/Presentation/Console/Command/*Command.php'
        autoconfigure: true
        autowire: true

    # Command Handlers
    Movioza\MediaProcessing\Application\Command\:
        resource: '%kernel.project_dir%/src/MediaProcessing/Application/Command/**/*Handler.php'

    # Aria2
    movioza.media_processing.aria2.rpc_client:
        class: Movioza\MediaProcessing\Infrastructure\Download\Aria2\Aria2RpcClient
        arguments:
            $endpoint: '%env(ARIA2_ENDPOINT)%'
            $secret: '%env(ARIA2_SECRET)%'

    movioza.media_processing.downloader.aria2:
        class: Movioza\MediaProcessing\Infrastructure\Download\Aria2\Aria2Downloader
        arguments:
            $rpc: '@movioza.media_processing.aria2.rpc_client'

    # Downloader
    Movioza\MediaProcessing\Application\Download\DownloaderInterface: '@movioza.media_processing.downloader.aria2'

    # Tracker Parsers
    Movioza\MediaProcessing\Infrastructure\Tracker\RutorParser:
        arguments:
            $supportedHosts: '%env(csv:RUTOR_SUPPORTED_HOSTS)%'
        tags:
            - { name: movioza.tracker_parser }

    # Each tracker tag must match a TorrentTracker value; the registry is indexed by that value.
    movioza.media_processing.tracker_parser_registry:
        class: Movioza\MediaProcessing\Infrastructure\Tracker\TrackerParserRegistry
        arguments:
            $parsers: !tagged_iterator movioza.tracker_parser

    Movioza\MediaProcessing\Application\Tracker\TrackerParserRegistryInterface: '@movioza.media_processing.tracker_parser_registry'

    # Tracker Storage
    movioza.media_processing.tracker_storage.local_file:
        class: Movioza\MediaProcessing\Infrastructure\Tracker\Storage\LocalTorrentFileStorage
        arguments:
            $directory: '%kernel.project_dir%/var/torrents'

    Movioza\MediaProcessing\Infrastructure\Tracker\Storage\TorrentFileStorageInterface: '@movioza.media_processing.tracker_storage.local_file'

    # State Machines
    movioza.media_processing.media_source_state_machine.symfony:
        class: Movioza\MediaProcessing\Infrastructure\Workflow\SymfonyMediaSourceWorkflow
        arguments:
            $stateMachine: '@state_machine.media_source'

    Movioza\MediaProcessing\Domain\StateMachine\MediaSourceStateMachineInterface: '@movioza.media_processing.media_source_state_machine.symfony'

    # Identity
    movioza.media_processing.media_source_id_generator.postgres:
        class: Movioza\MediaProcessing\Infrastructure\Identity\PostgresMediaSourceIDGenerator
        arguments:
            $connection: '@doctrine.dbal.default_connection'
            $sequenceName: 'media_processing_media_source_id_seq'

    Movioza\MediaProcessing\Application\Identity\MediaSourceIDGeneratorInterface: '@movioza.media_processing.media_source_id_generator.postgres'

    movioza.media_processing.download_source_id_generator.postgres:
        class: Movioza\MediaProcessing\Infrastructure\Identity\PostgresDownloadSourceIDGenerator
        arguments:
            $connection: '@doctrine.dbal.default_connection'
            $sequenceName: 'media_processing_download_source_id_seq'

    Movioza\MediaProcessing\Application\Identity\DownloadSourceIDGeneratorInterface: '@movioza.media_processing.download_source_id_generator.postgres'

    # Media
    movioza.media_processing.media_existence_checker.catalog:
        class: Movioza\MediaProcessing\Infrastructure\Integration\Catalog\CatalogMediaExistenceChecker

    Movioza\MediaProcessing\Application\Media\MediaExistenceCheckerInterface: '@movioza.media_processing.media_existence_checker.catalog'

