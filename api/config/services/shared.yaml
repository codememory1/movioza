services:
    _defaults:
        autoconfigure: false
        autowire: true

        bind:
            $appProtocol: '%env(APP_PROTOCOL)%'
            $apiHost: '%env(APP_API_HOST)%'

    # API Error Definitions
    Movioza\Shared\Infrastructure\Http\Exception\RateLimitExceededException:
        resource_tags:
            - name: movioza.api_error.definition
              status: 429
              code: rate_limit_exceeded
              message: 'Too many requests. Please try again later.'
              log_level: notice

    Movioza\Shared\Infrastructure\Http\Exception\RequestValidationException:
        resource_tags:
            - name: movioza.api_error.definition
              status: 422
              code: request_validation_failed
              message: 'Request validation failed.'
              log_level: notice

    Movioza\Shared\Infrastructure\Http\Exception\InvalidJsonPayloadException:
        resource_tags:
            - name: movioza.api_error.definition
              status: 400
              code: invalid_json
              message: 'The request body must contain valid JSON.'
              log_level: notice

    Movioza\Shared\Infrastructure\Http\Exception\MissingRequiredFieldsException:
        resource_tags:
            - name: movioza.api_error.definition
              status: 400
              code: missing_required_fields
              message: 'Required fields are missing.'
              log_level: notice

    Movioza\Shared\Infrastructure\Http\Exception\UnknownFieldsException:
        resource_tags:
            - name: movioza.api_error.definition
              status: 400
              code: unknown_fields
              message: 'The request body contains unknown fields.'
              log_level: notice

    Movioza\Shared\Infrastructure\Http\Exception\InvalidFieldTypeException:
        resource_tags:
            - name: movioza.api_error.definition
              status: 400
              code: invalid_field_type
              message: 'A request field has an invalid type.'
              log_level: notice

    Movioza\Shared\Infrastructure\Http\Exception\InvalidFieldValueException:
        resource_tags:
            - name: movioza.api_error.definition
              status: 400
              code: invalid_field_value
              message: 'A request field contains an invalid value.'
              log_level: notice

    Movioza\Shared\Infrastructure\Http\Exception\InvalidFieldException:
        resource_tags:
            - name: movioza.api_error.definition
              status: 400
              code: invalid_field
              message: 'A request field could not be processed.'
              log_level: notice

    # Repositories
    movioza.shared.country_repository.doctrine:
        class: Movioza\Shared\Infrastructure\Doctrine\Repository\DoctrineCountryRepository

    Movioza\Shared\Domain\Repository\CountryRepositoryInterface: '@movioza.shared.country_repository.doctrine'

    # Readers
    movioza.shared.country_reader.doctrine:
        class: Movioza\Shared\Infrastructure\Doctrine\Reader\DoctrineCountryReader

    Movioza\Shared\Application\Reader\CountryReaderInterface: '@movioza.shared.country_reader.doctrine'

    # Command Bus
    movioza.shared.command_bus.symfony:
        class: Movioza\Shared\Infrastructure\Bus\SymfonyCommandBus
        arguments:
            $commandBus: '@command.bus'

    Movioza\Shared\Application\Bus\Command\CommandBusInterface: '@movioza.shared.command_bus.symfony'

    # Query Bus
    movioza.shared.query_bus.symfony:
        class: Movioza\Shared\Infrastructure\Bus\SymfonyQueryBus
        arguments:
            $queryBus: '@query.bus'

    Movioza\Shared\Application\Bus\Query\QueryBusInterface: '@movioza.shared.query_bus.symfony'

    # HTTP Attribute Handlers Registry
    Movioza\Shared\Infrastructure\Http\Attribute\Controller\HandlerRegistry:
        autowire: true

    Movioza\Shared\Infrastructure\Http\Attribute\ControllerArgument\HandlerRegistry:
        autowire: true

    # HTTP Event Listeners
    Movioza\Shared\Infrastructure\Http\EventListener\KernelController\:
        resource: '../../src/Shared/Infrastructure/Http/EventListener/KernelController/*EventListener.php'
        tags:
            - { name: kernel.event_listener, event: kernel.controller, method: onKernelController }

    Movioza\Shared\Infrastructure\Http\EventListener\KernelException\:
        resource: '../../src/Shared/Infrastructure/Http/EventListener/KernelException/*EventListener.php'
        tags:
            - name: kernel.event_listener
              event: kernel.exception
              method: captureException
              priority: 64

            - name: kernel.event_listener
              event: kernel.exception
              method: onKernelException
              priority: -64

    Movioza\Shared\Infrastructure\Http\EventListener\KernelView\:
        resource: '../../src/Shared/Infrastructure/Http/EventListener/KernelView/*EventListener.php'
        tags:
            - { name: kernel.event_listener, event: kernel.view, method: onKernelView }

    Movioza\Shared\Infrastructure\Http\EventListener\KernelResponse\:
        resource: '../../src/Shared/Infrastructure/Http/EventListener/KernelResponse/*EventListener.php'
        tags:
            - { name: kernel.event_listener, event: kernel.response, method: onKernelResponse }

    Movioza\Shared\Infrastructure\Http\EventListener\KernelResponse\CacheResponseEventListener:
        arguments:
            $cache: '@cache.api_response'
        tags:
            - { name: kernel.event_listener, event: kernel.response, method: onKernelResponse }

    # Run the custom attribute resolver early; it must yield nothing for unsupported arguments.
    Movioza\Shared\Infrastructure\Http\Resolver\AttributeValueResolver:
        tags:
            - { name: controller.argument_value_resolver, priority: 150 }

    # HTTP Attribute Handlers
    Movioza\Shared\Infrastructure\Http\Attribute\Controller\:
        resource: '../../src/Shared/Infrastructure/Http/Attribute/Controller/*Handler.php'
        tags:
            - { name: movioza.controller.attribute_handler }

    Movioza\Shared\Infrastructure\Http\Attribute\Controller\CacheResponseHandler:
        arguments:
            $cache: '@cache.api_response'
            $lockFactory: '@lock.api_response.factory'
            $lockTTL: '%env(int:API_RESPONSE_CACHE_LOCK_TTL)%'
            $lockWaitTimeout: '%env(int:API_RESPONSE_CACHE_LOCK_WAIT_TIMEOUT)%'
            $lockRetryDelay: '%env(int:API_RESPONSE_CACHE_LOCK_RETRY_DELAY_US)%'
        tags:
            - { name: movioza.controller.attribute_handler }

    Movioza\Shared\Infrastructure\Http\Attribute\ControllerArgument\:
        resource: '../../src/Shared/Infrastructure/Http/Attribute/ControllerArgument/*Handler.php'
        tags:
            - { name: movioza.controller.argument_attribute_handler }

    # HTTP Request ID Resolver
    Movioza\Shared\Infrastructure\Http\RequestIDResolver: ~

    # HTTP Cache
    Movioza\Shared\Infrastructure\Http\Cache\ResponseCacheTagger: ~

    # CDN
    movioza.shared.cdn_provider.bunny:
        class: Movioza\Shared\Infrastructure\Cdn\Provider\BunnyCdnProvider
        arguments:
            $domain: '%env(BUNNY_DOMAIN)%'
            $secretKey: '%env(BUNNY_SECRET_KEY)%'
        tags:
            - { name: movioza.cdn.provider }

    movioza.shared.cdn_generator.default:
        class: Movioza\Shared\Infrastructure\Cdn\CdnUrlGenerator
        arguments:
            $providers: !tagged_iterator movioza.cdn.provider

    Movioza\Shared\Application\Cdn\CdnUrlGeneratorInterface: '@movioza.shared.cdn_generator.default'

    # Slug
    movioza.shared.slug_generaror.cocur:
        class: Movioza\Shared\Infrastructure\Slug\CocurSlugGenerator

    Movioza\Shared\Application\Slug\SlugGeneratorInterface: '@movioza.shared.slug_generaror.cocur'

    # Event
    movioza.shared.domain_event_dispatcher.symfony:
        class: Movioza\Shared\Infrastructure\Event\SymfonyDomainEventDispatcher

    Movioza\Shared\Application\Event\DomainEventDispatcherInterface: '@movioza.shared.domain_event_dispatcher.symfony'

    # Transaction
    movioza.shared.transaction_manager.doctrine:
        class: Movioza\Shared\Infrastructure\Doctrine\Transaction\DoctrineTransactionManager

    Movioza\Shared\Application\Transaction\TransactionManagerInterface: '@movioza.shared.transaction_manager.doctrine'

    # Serializer
    Symfony\Component\Serializer\Normalizer\BackedEnumNormalizer:
        tags:
            - { name: serializer.normalizer }

    Movioza\Shared\Infrastructure\Serializer\Normalizer\:
        resource: '%kernel.project_dir%/src/Shared/Infrastructure/Serializer/Normalizer/*Normalizer.php'
        tags:
            - { name: serializer.normalizer }

    Symfony\Component\Serializer\NameConverter\CamelCaseToSnakeCaseNameConverter: ~

    # Query Handlers
    Movioza\Shared\Application\Query\:
        resource: '%kernel.project_dir%/src/Shared/Application/Query/**/*QueryHandler.php'
        tags:
            - { name: messenger.message_handler, bus: query.bus }

    # Controllers
    Movioza\Shared\Presentation\Http\Controller\:
        resource: '%kernel.project_dir%/src/Shared/Presentation/Http/Controller/*Controller.php'
        tags:
            - { name: controller.service_arguments }

    # Clock
    movioza.shared.clock.system:
        class: Movioza\Shared\Infrastructure\Clock\SystemClock

    Movioza\Shared\Application\Clock\ClockInterface: '@movioza.shared.clock.system'
