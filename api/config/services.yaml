imports:
    - { resource: './services/shared.yaml' }
    - { resource: './services/assets.yaml' }
    - { resource: './services/people.yaml' }
    - { resource: './services/catalog.yaml' }
    - { resource: './services/media_processing.yaml' }
    - { resource: './services/fixtures.yaml' }

parameters:
    movioza.api_host: '%env(APP_API_HOST)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        Psr\Log\LoggerAwareInterface:
            calls:
                - [setLogger, ['@logger']]

    # Redis
    movioza.redis.client:
        class: Predis\Client
        arguments:
            - {
                scheme: '%env(REDIS_SCHEME)%',
                host: '%env(REDIS_HOST)%',
                port: '%env(REDIS_PORT)%',
                password: '%env(REDIS_PASSWORD)%',
                database: '%env(REDIS_DATABASE)%',
                read_write_timeout: -1
            }

    Predis\ClientInterface: '@movioza.redis.client'

    # AWS
    movioza.s3.client:
        class: Aws\S3\S3Client
        arguments:
            -   version: '%env(S3_VERSION)%'
                region: '%env(S3_REGION)%'
                endpoint: '%env(S3_ENDPOINT)%'
                use_path_style_endpoint: '%env(bool:S3_USE_PATH_STYLE_ENDPOINT)%'
                credentials:
                    key: '%env(S3_ACCESS_KEY)%'
                    secret: '%env(S3_SECRET_KEY)%'

    Aws\S3\S3ClientInterface: '@movioza.s3.client'
