framework:
    messenger:
        default_bus: command.bus
        failure_transport: failed_default

        buses:
            command.bus:
                middleware:
                    - doctrine_close_connection

            query.bus: ~

        transports:
            sync:
                dsn: 'sync://'

            failed_default:
                dsn: '%env(MESSENGER_FAILED_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: failed_exchange
                        type: fanout
                    queues:
                        failed_default: ~
        routing: []
