# Source: PostgreSQL.
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.database.hostname=${DEBEZIUM_POSTGRES_HOST}
debezium.source.database.port=${DEBEZIUM_POSTGRES_PORT}
debezium.source.database.dbname=${DEBEZIUM_POSTGRES_DBNAME}
debezium.source.database.user=${DEBEZIUM_POSTGRES_USER}
debezium.source.database.password=${DEBEZIUM_POSTGRES_PASSWORD}

# Use PostgreSQL built-in logical decoding plugin.
debezium.source.plugin.name=pgoutput

# Keep these identifiers stable across connector restarts.
debezium.source.topic.prefix=${DEBEZIUM_TOPIC_PREFIX}
debezium.source.slot.name=${DEBEZIUM_SLOT_NAME}
debezium.source.publication.name=${DEBEZIUM_PUBLICATION_NAME}

# Use the publication created by the database administrator.
debezium.source.publication.autocreate.mode=disabled

# Capture only public.media during the initial setup.
debezium.source.table.include.list=public[.]media

# Read existing rows on the first startup, then stream committed changes.
debezium.source.snapshot.mode=initial

# Keep DELETE events, but omit the additional null-valued tombstones.
debezium.source.tombstones.on.delete=false

# Persist the connector position in the mounted data directory.
debezium.source.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat

# Attempt to flush offsets every second.
debezium.source.offset.flush.interval.ms=1000

# Destination: publish CDC events to RabbitMQ.
debezium.sink.type=rabbitmq
debezium.sink.rabbitmq.connection.host=${DEBEZIUM_RABBITMQ_HOST}
debezium.sink.rabbitmq.connection.port=${DEBEZIUM_RABBITMQ_PORT}
debezium.sink.rabbitmq.connection.username=${DEBEZIUM_RABBITMQ_USER}
debezium.sink.rabbitmq.connection.password=${DEBEZIUM_RABBITMQ_PASSWORD}

# RabbitMQ topology is created separately before starting the connector.
debezium.sink.rabbitmq.exchange=${DEBEZIUM_RABBITMQ_EXCHANGE}
debezium.sink.rabbitmq.routingKey=${DEBEZIUM_RABBITMQ_ROUTING_KEY}
debezium.sink.rabbitmq.autoCreateRoutingKey=false

# Publish persistent messages.
debezium.sink.rabbitmq.deliveryMode=2

# Keep the event envelope as JSON without embedded schema definitions.
debezium.format.value=json
debezium.format.value.schemas.enable=false

# Internal HTTP port for health endpoints.
quarkus.http.port=8080

# Application logging.
quarkus.log.level=INFO